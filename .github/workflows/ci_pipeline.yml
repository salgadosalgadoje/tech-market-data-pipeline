name: Tech Market CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Pytest & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==2.8.2" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.8.2/constraints-3.11.txt"
          pip install -r requirements.txt

      - name: Execute Pytest Suite (with Moto AWS Mocks & Airflow DAG Integrity)
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow_home
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"
          AWS_ACCESS_KEY_ID: testing_access_key
          AWS_SECRET_ACCESS_KEY: testing_secret_key
          AWS_SECURITY_TOKEN: testing_security_token
          AWS_SESSION_TOKEN: testing_session_token
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET_NAME: ci-mock-bucket
          S3_BRONZE_PREFIX: bronze/market_data
          S3_SILVER_PREFIX: silver/market_data
        run: |
          python -m pytest tests/ -v --tb=short
