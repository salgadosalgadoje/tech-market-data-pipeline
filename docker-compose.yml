version: '3.8'

# ==============================================================================
# Shared Airflow Configuration (Anchor for DRY Configuration)
# ==============================================================================
x-airflow-common: &airflow-common
  image: apache/airflow:2.8.2-python3.11
  restart: always
  env_file:
    - .env
  environment:
    # --------------------------------------------------------------------------
    # Airflow Core & Database: LocalExecutor backed by containerized PostgreSQL
    # --------------------------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-market_data}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session

    # --------------------------------------------------------------------------
    # Medallion Gold Layer / App Overrides
    # POSTGRES_HOST MUST point to the Docker service 'postgres', NOT 'localhost'
    # --------------------------------------------------------------------------
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-market_data}

    # Python module discovery
    PYTHONPATH: /opt/airflow:/opt/airflow/src

    # Automatic runtime dependency installation inside Airflow containers
    # Pinned numpy<2.0.0 and pyarrow<17.0.0 to prevent C-extension binary incompatibilities
    _PIP_ADDITIONAL_REQUIREMENTS: "yfinance>=0.2.36 boto3>=1.34.0 pandas>=2.1.4 pydantic>=2.6.0 fastparquet>=2024.2.0 pyarrow<17.0.0 numpy<2.0.0"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs

  depends_on:
    postgres:
      condition: service_healthy

  networks:
    - tech_market_net

# ==============================================================================
# Services
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Data Warehouse & Airflow Metadata Store
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tech_market_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-market_data}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-market_data}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tech_market_net

  # ----------------------------------------------------------------------------
  # Airflow Database Initialization & Admin User Setup
  # ----------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: tech_market_airflow_init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username admin \
          --firstname Tech \
          --lastname Lead \
          --role Admin \
          --email admin@techmarket.com \
          --password admin || true
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Airflow Webserver (UI dashboard on http://localhost:8080)
  # ----------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: tech_market_airflow_webserver
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: [ "CMD-SHELL", "[ $$(curl -f http://localhost:8080/health 2>&1 | grep -c '\"healthy\"') -ge 1 ]" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------------
  # Airflow Scheduler (DAG execution & task scheduling engine)
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: tech_market_airflow_scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local

networks:
  tech_market_net:
    driver: bridge
